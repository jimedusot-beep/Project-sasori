name: Temporary M1 Test Formatter
on:
  push:
    branches: [fix/m1-inspection-deadline-teardown-20261102]
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact formatted Bluetooth test
        run: |
          npx prettier tests/bluetooth.test.mjs > /tmp/sasori-m1-test.mjs
          node -e 'const fs = require("node:fs"); console.log("SASORI_M1_TEST_FORMAT_BEGIN" + JSON.stringify(fs.readFileSync("/tmp/sasori-m1-test.mjs","utf8")) + "SASORI_M1_TEST_FORMAT_END")'

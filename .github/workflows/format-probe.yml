name: Temporary formatting verification
on:
  push:
    branches: [feat/rea-private-capture-handoff]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only newly added files and emit source-safe JSON
        run: |
          npx prettier --write docs/rea-handoff.md scripts/rea-handoff.mjs tests/rea-handoff.test.mjs
          node --input-type=module -e "import { readFileSync } from 'node:fs'; for(const file of ['docs/rea-handoff.md','scripts/rea-handoff.mjs','tests/rea-handoff.test.mjs']) console.log('FORMATTEDFILE::'+file+'::'+JSON.stringify(readFileSync(file,'utf8')))"

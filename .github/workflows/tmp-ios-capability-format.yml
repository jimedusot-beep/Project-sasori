name: Temporary iPhone capability formatting
on:
  push:
    branches: [fix/ios-capability-first-hub-20261101]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/ios-capability-first-hub-20261101
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - name: Format changed files
        run: >
          npx prettier --write
          docs/iphone-elmo-acceptance.md native/ios/configure.mjs
          site/hub-ui.js site/lib/platform-capabilities.js
          tests/browser/native-hub-capabilities.spec.js tests/platform-capabilities.test.mjs
      - name: Commit formatting on branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/iphone-elmo-acceptance.md native/ios/configure.mjs site/hub-ui.js site/lib/platform-capabilities.js tests/browser/native-hub-capabilities.spec.js tests/platform-capabilities.test.mjs
            git commit -m 'style: format iPhone capability controls'
            git push origin HEAD:fix/ios-capability-first-hub-20261101
          fi

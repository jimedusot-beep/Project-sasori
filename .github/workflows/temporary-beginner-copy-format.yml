name: Temporary Beginner Copy Formatter
on:
  push:
    branches: [fix/beginner-demo-action-receipts-20261102]
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact formatted JavaScript without changing branch
        run: |
          npx prettier site/hub-ui.js > /tmp/hub-ui.js
          npx prettier tests/browser/device-detail.spec.js > /tmp/device-detail.spec.js
          npx prettier tests/device-detail.test.mjs > /tmp/device-detail.test.mjs
          node -e 'const fs=require("node:fs");for(const [tag,p] of [["HUB","/tmp/hub-ui.js"],["BROWSER","/tmp/device-detail.spec.js"],["UNIT","/tmp/device-detail.test.mjs"]])console.log("SASORI_FORMAT_"+tag+"_BEGIN"+JSON.stringify(fs.readFileSync(p,"utf8"))+"SASORI_FORMAT_"+tag+"_END")'

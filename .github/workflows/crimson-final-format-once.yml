name: Format final crimson changes once
on:
  push:
    branches: [feat/crimson-puppet-lab-theme-20261026]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write site/explore.html tests/browser/sasori-theme.spec.js
      - name: Commit formatting only
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/explore.html tests/browser/sasori-theme.spec.js
            git commit -m "style(theme): format warning labels and checks"
            git push origin HEAD:feat/crimson-puppet-lab-theme-20261026
          fi

name: Verify laboratory
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
# A PR and its feature-branch push share one verification identity. Keep only
# the newest commit's expensive browser/firmware checks; main release verification
# has its own identity and is not displaced by a feature branch.
concurrency:
  group: sasori-lab-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Catch native npm lockfile drift and moderate advisories on Linux before
  # reserving the scarcer macOS simulator runners.
  native-dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/ios/package-lock.json
      - name: Install exactly the locked native dependencies
        working-directory: native/ios
        run: npm ci
      - name: Reject moderate or higher native dependency advisories
        working-directory: native/ios
        run: npm audit --audit-level=moderate
  pocket-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile pinned ESP32-S3 reference firmware (no flashing)
        run: bash scripts/build-pocket-ir.sh
  checks:
    runs-on: ubuntu-latest
    # Browser binaries and OS dependencies can exhaust 15 minutes before the iPhone WebKit suite completes.
    # Reserve enough wall time for installation plus the real cross-browser acceptance tests.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install and verify desktop BLE helper
        run: |
          python3 -m venv /tmp/sasori-desktop-env
          /tmp/sasori-desktop-env/bin/python -m pip install -r desktop/requirements.txt
          /tmp/sasori-desktop-env/bin/python -c "from bleak import BleakClient, BleakScanner"
          /tmp/sasori-desktop-env/bin/python -m unittest discover -s desktop/tests -v
          /tmp/sasori-desktop-env/bin/python desktop/sasori_ble.py --simulate --output /tmp/sasori-desktop-ci.json
          node scripts/verify-desktop-export.mjs /tmp/sasori-desktop-ci.json
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: Temporary Prettier Diff
on:
  push:
    branches:
      - fix/native-ble-fault-status-main-ci-20261102
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff without changing branch
        run: |
          npx prettier tests/native-disconnect-faults.test.mjs > /tmp/sasori-prettier.mjs
          diff -u tests/native-disconnect-faults.test.mjs /tmp/sasori-prettier.mjs || true

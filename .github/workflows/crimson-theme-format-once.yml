name: Format crimson theme once
on:
  push:
    branches: [feat/crimson-puppet-lab-theme-20261026]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format theme-related source
        run: >-
          npx prettier --write
          site/tokens.css site/sasori-theme.css site/puppet-clouds.svg
          site/icon.svg site/index.html site/hub.html site/explore.html
          site/projects.html site/elmo.html site/signal-atlas.html
          site/privacy.html site/pocket-ir.html site/keyfob-lab.html
          site/companion.html scripts/verify-site.mjs
          tests/browser/sasori-theme.spec.js
          docs/crimson-puppet-lab-theme-2026-10-26.md
      - name: Commit any formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/tokens.css site/sasori-theme.css site/puppet-clouds.svg site/icon.svg site/index.html site/hub.html site/explore.html site/projects.html site/elmo.html site/signal-atlas.html site/privacy.html site/pocket-ir.html site/keyfob-lab.html site/companion.html scripts/verify-site.mjs tests/browser/sasori-theme.spec.js docs/crimson-puppet-lab-theme-2026-10-26.md
            git commit -m "style(theme): format crimson puppet lab"
            git push origin HEAD:feat/crimson-puppet-lab-theme-20261026
          fi

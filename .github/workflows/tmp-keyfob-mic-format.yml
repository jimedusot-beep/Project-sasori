name: Temporary iPhone mic formatting
on:
  push:
    branches: [fix/keyfob-ios-mic-state-20261025]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/keyfob-ios-mic-state-20261025
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - run: npx prettier --write site/keyfob-lab.html site/keyfob-lab.js tests/browser/keyfob-audio.spec.js
      - run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/keyfob-lab.html site/keyfob-lab.js tests/browser/keyfob-audio.spec.js
            git commit -m 'style: format iPhone microphone diagnostic fix'
            git push origin HEAD:fix/keyfob-ios-mic-state-20261025
          fi

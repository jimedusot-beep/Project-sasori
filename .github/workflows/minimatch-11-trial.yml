name: Evaluate patched minimatch for Sasori (#75)

on:
  push:
    branches: [security/minimatch-11-trial-20261104]

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Add isolated root npm override (not committed)
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const path = "package.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.overrides = { ...manifest.overrides, minimatch: "^11.0.1" };
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          '
      - name: Generate authentic npm lockfile from registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify fresh locked installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency graph
        run: |
          npm ls minimatch --all
          node --input-type=module -e '
            import fs from "node:fs";
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const versions = Object.entries(lock.packages)
              .filter(([path]) => path.endsWith("/minimatch"))
              .map(([, data]) => data.version);
            if (!versions.length || versions.some(v => Number(v.split(".")[0]) < 11 || v === "11.0.0")) {
              throw new Error("Unpatched minimatch remains: " + versions.join(", "));
            }
            console.log("Patched minimatch versions:", versions.join(", "));
          '
      - name: Run existing full source checks
        run: npm run check
      - name: Audit including moderate advisories
        run: npm audit --audit-level=moderate --ignore-scripts
      - name: Save registry-resolved test manifest and lockfile
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minimatch11-generated-lock
          path: |
            package.json
            package-lock.json
          retention-days: 7

name: Temporary Privacy Lab formatting
on:
  push:
    branches: [feature/privacy-lab-rebased-20261025]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/privacy-lab-rebased-20261025
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - run: npx prettier --write native/ios/configure.mjs site/hub.html
      - run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add native/ios/configure.mjs site/hub.html
            git commit -m 'style: format Privacy Lab integration'
            git push origin HEAD:feature/privacy-lab-rebased-20261025
          fi

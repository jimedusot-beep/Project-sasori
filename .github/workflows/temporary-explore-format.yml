name: Temporary Explore Saved Formatter
on:
  push:
    branches: [fix/explore-saved-acceptance-20261102]
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact formatting for two files
        run: |
          npx prettier docs/explore-saved-acceptance.md > /tmp/explore-acceptance.md
          npx prettier tests/browser/unified-navigation.spec.js > /tmp/unified-navigation.spec.js
          node -e 'const fs=require("node:fs");for(const [tag,p] of [["DOC","/tmp/explore-acceptance.md"],["TEST","/tmp/unified-navigation.spec.js"]])console.log("SASORI_FORMAT_"+tag+"_BEGIN"+JSON.stringify(fs.readFileSync(p,"utf8"))+"SASORI_FORMAT_"+tag+"_END")'

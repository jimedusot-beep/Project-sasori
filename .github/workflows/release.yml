name: Release laboratory
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  issues: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const publishMetadata = require('./scripts/release.cjs');
            console.log(JSON.stringify(await publishMetadata({ github, context })));

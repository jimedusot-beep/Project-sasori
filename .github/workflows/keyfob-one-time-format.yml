name: One-time key-fob formatting
on:
  push:
    branches:
      - feature/phone-keyfob-audio-lab-20261025
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'jimedusot-beep/Project-sasori'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/phone-keyfob-audio-lab-20261025
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - name: Format changed files only
        run: >
          npx prettier --write
          docs/keyfob-audio-lab.md site/hub.html site/keyfob-lab.css
          site/keyfob-lab.html site/keyfob-lab.js site/lib/keyfob-audio.js
          site/projects.html tests/browser/keyfob-audio.spec.js tests/keyfob-audio.test.mjs
      - name: Commit formatting to feature branch only
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/keyfob-audio-lab.md site/hub.html site/keyfob-lab.css site/keyfob-lab.html site/keyfob-lab.js site/lib/keyfob-audio.js site/projects.html tests/browser/keyfob-audio.spec.js tests/keyfob-audio.test.mjs
            git commit -m 'style: format key-fob lab with repository Prettier'
            git push origin HEAD:feature/phone-keyfob-audio-lab-20261025
          fi

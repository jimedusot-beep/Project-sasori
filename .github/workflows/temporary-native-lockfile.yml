name: Temporary Native Lockfile Regeneration
on:
  push:
    branches:
      - fix/ios-glob-minimatch-advisories-20261102
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Generate lockfile from npm registry
        working-directory: native/ios
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ls glob minimatch --all || true
          node -e 'let j=require("./package-lock.json");console.log("SASORI_LOCK_JSON_START"+JSON.stringify(j)+"SASORI_LOCK_JSON_END")'
